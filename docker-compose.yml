version: '3.9'
services:
  redis:
    image: redis:7.4
    container_name: crypto_redis
    ports:
      - "6379:6379"
    restart: unless-stopped

  questdb:
    image: questdb/questdb:9.0.1
    container_name: crypto_questdb
    environment:
      - QDB_HTTP_ENABLED=true
    ports:
      - "9000:9000"
      - "9009:9009"
      - "8812:8812"
    restart: unless-stopped
